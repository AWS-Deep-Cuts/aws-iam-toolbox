<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- ハンズオンの構成図（README の「構築するアーキテクチャ」、記事の「ハンズオンはこちら！」）。
     左の枠は、あなた（管理者）が操作する 2 つの画面。右の枠は AWS アカウントの中で使うもの。
     上から順に、手順 2（CloudShell でロールに切り替え、修了証のポリシーを読み取る）、手順 3（コンソールで ID を照会する）、手順 4（コンソールで設定を修正する）。
     根拠:
       - 手順 2: hands-on/switch-role.sh が aws sts assume-role（IAM のアクション sts:AssumeRole）で、ハンズオン用ロール aws-deepcuts-handson-role の一時的な認証情報を取得する。
         STS からハンズオン用ロールへの縦の線の右にあるラベル「一時的な認証情報を発行する」は、このことを指す。README 手順 2 の「CloudShell がハンズオン用ロールの一時的な認証情報を使うようになります」と同じ説明。
         信頼ポリシーは sts:AssumeRole と sts:TagSession を許可（hands-on/setup.sh）。
       - 読み取り: aws iam get-policy（アクション iam:GetPolicy）で、管理ポリシー aws-deepcuts-certificate の説明文を読む。ロールの設定で拒否される（setup.sh、設計書 v3 のステージの表）。
       - 手順 3: エラーメッセージのリンク https://us-east-1.console.aws.amazon.com/iam/home?region=us-east-1#/authorization-details/<ID>。
         API は IAM Toolbox の GetRequestAuthorizationDetails。プレビューは us-east-1（IAM User Guide「Troubleshoot access denied error messages with authorization ID (Preview)」、ファクトシート 007・012）。
       - 手順 4: IAM コンソールの、ロールの「許可」タブ・「タグ」タブと、ポリシーの編集（設計書 v3「コンソールの操作で使う画面の名前」）。
     アイコン: npm パッケージ aws-icons（User, AWSCloudShell, Client, AWSCloudlogo, AWSAccount, AWSIdentityAccessManagementAWSSTS,
       AWSIdentityAccessManagementRole, AWSIdentityAccessManagementPermissions, AWSIdentityandAccessManagement） -->
<link rel="stylesheet" href="diagram.css">
<link rel="stylesheet" href="deepcuts.css">
<script src="wires.js"></script>
<style>
  #fig { width: 800px; height: 520px; }

  /* 枠。見出しはアイコン＋名前で、左上の角に置く（AWS の構成図の書き方） */
  .grp { position: absolute; border: 2px solid #242f3e; }
  .grp.you { border: 2px dashed var(--grey); }
  .grp > .gl { position: absolute; left: -2px; top: -2px; display: flex; align-items: center; gap: 8px;
    background: var(--bone); padding-right: 8px; font-size: 17px; font-weight: 900; white-space: nowrap; }
  .grp > .gl img { width: 32px; height: 32px; display: block; }
  .grp > .gl.mono { font-family: var(--font-mono); font-weight: 800; font-size: 17px; letter-spacing: .02em; }

  /* ノード：アイコン・名前・リソース名 */
  .node .t { line-height: 1.25; }
  .node .s.code { font-family: var(--font-mono); font-weight: 800; font-size: 15px; color: #4a4843; line-height: 1.3; margin-top: 1px; }

  /* 線の上のラベル。手順は黒、拒否は差し色 */
  .lbl.step { color: var(--ink); font-weight: 700; }
  .lbl.step b { font-weight: 900; }
  .lbl.deny { color: var(--hot); font-weight: 900; }
  .lbl.deny.code { font-family: var(--font-mono); font-weight: 800; font-size: 15px; line-height: 22px; }
</style>
</head><body>
<div id="fig">
  <svg id="wires"></svg>

  <!-- 左：あなた（管理者）が操作する画面 -->
  <div class="grp you" style="left:0;top:0;width:170px;height:520px">
    <div class="gl"><img src="../icons/User.svg" alt="">あなた・管理者</div>
  </div>
  <div class="node" id="cs" style="left:5px;top:98px;width:160px"><img src="../icons/AWSCloudShell.svg" alt=""><div class="t">AWS CloudShell</div></div>
  <div class="node" id="con" style="left:5px;top:222px;width:160px"><img src="../icons/Client.svg" alt=""><div class="t">マネジメント<br>コンソール</div><div class="s">ブラウザ</div></div>

  <!-- 右：AWS アカウント -->
  <div class="grp" style="left:186px;top:0;width:614px;height:520px">
    <div class="gl mono"><img src="../icons/AWSCloudlogo.svg" alt="">AWS Cloud</div>
  </div>
  <div class="grp" style="left:200px;top:44px;width:586px;height:462px">
    <div class="gl"><img src="../icons/AWSAccount.svg" alt="">AWS アカウント</div>
  </div>

  <div class="node" id="sts" style="left:423px;top:98px;width:160px"><img src="../icons/AWSIdentityAccessManagementAWSSTS.svg" alt=""><div class="t">AWS STS</div><div class="s code">sts:AssumeRole</div></div>
  <div class="node" id="ats" style="left:347px;top:222px;width:150px"><img src="../icons/AWSIdentityandAccessManagement.svg" alt=""><div class="t">IAM Access<br>Troubleshooter</div><div class="s code">us-east-1</div></div>
  <div class="node" id="role" style="left:418px;top:362px;width:170px"><img src="../icons/AWSIdentityAccessManagementRole.svg" alt=""><div class="t">ハンズオン用ロール</div><div class="s code">aws-deepcuts-<br>handson-role</div></div>
  <div class="node" id="cert" style="left:620px;top:362px;width:160px"><img src="../icons/AWSIdentityAccessManagementPermissions.svg" alt=""><div class="t">修了証のポリシー</div><div class="s code">aws-deepcuts-<br>certificate</div></div>

  <!-- 線のラベル -->
  <div class="lbl step" id="l2" style="left:214px;top:100px"><b>手順 2:</b> ロールに切り替える</div>
  <div class="lbl step" id="l3" style="left:214px;top:218px"><b>手順 3:</b> ID で照会する</div>
  <div class="lbl step" id="l4" style="left:214px;top:364px"><b>手順 4:</b> 設定を修正する</div>
  <div class="lbl" id="lsts" style="left:516px;top:271px">一時的な認証情報を発行する</div>
  <div class="lbl deny code" id="lg" style="left:541px;top:362px">iam:GetPolicy</div>
  <div class="lbl deny" id="ld" style="left:559px;top:394px">拒否される</div>
</div>
<script>
window.addEventListener('load', async () => { await document.fonts.ready;
  wire('#cs', '#sts', {});                                   // 手順 2：ロールに切り替える
  wire('#sts', '#role', {from: 'b', to: 't'});               // STS が一時的な認証情報を発行し、ロールとして操作できるようになる
  wire('#role', '#cert', {hot: true});                       // ロールとして iam:GetPolicy → 拒否される
  wire('#con', '#ats', {});                                  // 手順 3：ID で照会する
  wire('#con', '#role', {from: 'b', to: 'l', elbow: 'v'});   // 手順 4：設定を修正する
  document.body.dataset.ready = '1';
});
</script>
</body></html>
